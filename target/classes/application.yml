spring:
  application:
    name: block-optimizer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:railway_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

supabase:
  url: ${SUPABASE_URL:https://xyzcompany.supabase.co}
  service-role-key: ${SUPABASE_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock_key}
  anon-key: ${SUPABASE_ANON_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock_anon_key}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:railway-imports}

logging:
  level:
    root: INFO
    com.railway.blockoptimizer: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SUPABASE_DB_URL:jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:5432/${SUPABASE_DB_NAME:postgres}?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres.myproject}
    password: ${SUPABASE_DB_PASSWORD:secret_db_password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
